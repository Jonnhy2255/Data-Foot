name: Scrape Melbet Live Football

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures — ajuste selon ton besoin
  workflow_dispatch:        # permet un lancement manuel depuis l'onglet Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install playwright==1.47.0
          playwright install --with-deps chromium

      - name: Lancer le scraper
        run: python scraper.py

      - name: Upload du CSV en artifact
        uses: actions/upload-artifact@v4
        with:
          name: championnats-live
          path: championnats_live.csv

      - name: Upload debug (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_screenshot.png
            debug_page.html
