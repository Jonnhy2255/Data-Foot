name: ESPN Scraper

on:
  # Déclenchement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch: {}

  # Exécution automatique périodique. Comme le script ne traite que
  # MAX_NEW_MATCHES_PER_TEAM_PER_RUN (26) nouveaux matchs par équipe et
  # par run, plusieurs exécutions successives sont nécessaires pour
  # rattraper tout l'historique — d'où le déclenchement récurrent.
  # Ajuste la fréquence si besoin (syntaxe cron, heure UTC).
  schedule:
    - cron: "0 */3 * * *"  # toutes les 3 heures

# Empêche deux exécutions de tourner en même temps sur le même dépôt
# (elles écrivent/committent les mêmes fichiers) : la suivante attend
# que la précédente soit terminée au lieu de s'exécuter en parallèle.
concurrency:
  group: espn-scraper
  cancel-in-progress: false

permissions:
  contents: write  # nécessaire pour committer/pousser les fichiers générés

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4

      - name: Lancer le scraper (t.py)
        run: python t.py

      - name: Committer et pousser les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/football/leagues/data_teams.json data/football/leagues/progress.txt

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à committer."
          else
            git commit -m "chore(scraper): mise à jour automatique des données ESPN [skip ci]"
            # Récupère les changements distants éventuels avant de pousser,
            # pour éviter un rejet en cas de commit concurrent.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Uploader les fichiers générés en artefact (sauvegarde/débogage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-scraper-output-${{ github.run_number }}
          path: |
            data/football/leagues/data_teams.json
            data/football/leagues/progress.txt
          retention-days: 14
          if-no-files-found: warn
