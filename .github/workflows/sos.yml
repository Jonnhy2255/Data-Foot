name: Git Pull Rebase

on:
  workflow_dispatch:  # Déclenchement manuel depuis l'interface GitHub
  # schedule:
  #   - cron: '0 */6 * * *'  # Optionnel: toutes les 6h

jobs:
  pull-rebase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tout l'historique pour le rebase
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Pull and rebase
        run: |
          git pull --rebase origin ${{ github.ref_name }}
      
      - name: Push changes (si rebase effectué)
        if: success()
        run: |
          git push origin ${{ github.ref_name }}