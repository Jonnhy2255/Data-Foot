name: Live Matches Scraper (Manuel)

on:
  # UNIQUEMENT déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      # Paramètres optionnels pour personnaliser l'exécution
      max_scrolls:
        description: 'Nombre maximum de scrolls'
        required: false
        default: '20'
        type: string
      headless:
        description: 'Mode headless (true/false)'
        required: false
        default: 'true'
        type: string
      save_logs:
        description: 'Sauvegarder les logs'
        required: false
        default: 'true'
        type: boolean

jobs:
  scrape-live-matches:
    runs-on: ubuntu-latest
    
    # Pas de stratégie particulière, exécution simple
    steps:
      # 1. Checkout du code
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        
      # 2. Configuration de Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      # 3. Affichage des paramètres
      - name: 📋 Paramètres d'exécution
        run: |
          echo "🔧 Configuration :"
          echo "  - Max scrolls: ${{ github.event.inputs.max_scrolls || '20' }}"
          echo "  - Headless: ${{ github.event.inputs.headless || 'true' }}"
          echo "  - Save logs: ${{ github.event.inputs.save_logs || 'true' }}"
          
      # 4. Installation des dépendances
      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps
          
      # 5. Exécution du scraper
      - name: 🚀 Exécution du scraper
        id: scraper
        run: |
          echo "🔄 Démarrage du scraping..."
          python live.py
        continue-on-error: true
        env:
          MAX_SCROLLS: ${{ github.event.inputs.max_scrolls || '20' }}
          HEADLESS: ${{ github.event.inputs.headless || 'true' }}
        
      # 6. Vérification des résultats
      - name: 📊 Vérification des résultats
        id: check_results
        run: |
          echo "📊 Vérification des fichiers générés..."
          
          if [ -f "matches_live.json" ]; then
            echo "✅ matches_live.json trouvé"
            echo "matches_found=true" >> $GITHUB_OUTPUT
            
            # Compter les matchs
            MATCHES_COUNT=$(python -c "import json; data=json.load(open('matches_live.json')); print(len(data['matches']))" 2>/dev/null || echo "0")
            echo "matches_count=$MATCHES_COUNT" >> $GITHUB_OUTPUT
            
            # Taille du fichier
            FILE_SIZE=$(du -h matches_live.json | cut -f1)
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            
            # Afficher un résumé
            echo ""
            echo "📊 RÉSUMÉ DU SCRAPING :"
            echo "  - Matchs trouvés: $MATCHES_COUNT"
            echo "  - Taille du fichier: $FILE_SIZE"
            
            # Afficher les 5 premiers matchs
            echo ""
            echo "🔍 APERÇU DES 5 PREMIERS MATCHS :"
            python -c "
import json
data = json.load(open('matches_live.json'))
for i, match in enumerate(data['matches'][:5]):
    home = match.get('firstOpponentName', '?') or match.get('homeTeam', '?')
    away = match.get('secondOpponentName', '?') or match.get('awayTeam', '?')
    champ = match.get('champName', 'Championnat inconnu') or match.get('championship', 'Championnat inconnu')
    score_h = match.get('score_home', '0') or match.get('scoreHome', '0')
    score_a = match.get('score_away', '0') or match.get('scoreAway', '0')
    print(f'   {i+1}. {home} {score_h} - {score_a} {away} ({champ})')
" 2>/dev/null || echo "  (Impossible d'afficher l'aperçu)"
            
          else
            echo "❌ matches_live.json NON trouvé"
            echo "matches_found=false" >> $GITHUB_OUTPUT
            
            # Vérifier s'il y a d'autres fichiers JSON
            echo ""
            echo "📁 Autres fichiers JSON trouvés :"
            find . -name "*.json" -type f -not -path "./.git/*" | head -10
          fi
        continue-on-error: true
        
      # 7. Sauvegarde des résultats
      - name: 💾 Sauvegarde des artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-matches-${{ github.run_id }}
          path: |
            matches_live.json
            matches_live_*.json
            *.log
            *.txt
            !__pycache__
          retention-days: 30
          compression-level: 6
          
      # 8. Sauvegarde spécifique des logs
      - name: 📝 Sauvegarde des logs
        if: ${{ github.event.inputs.save_logs == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            *.log
            *.txt
            !matches_live.json
          retention-days: 7
          if-no-files-found: ignore
          
      # 9. Résumé final
      - name: ✅ Résumé final
        if: always()
        run: |
          echo "========================================"
          echo "🏁 SCRAPING TERMINÉ"
          echo "========================================"
          echo ""
          echo "📊 Résultats :"
          if [ "${{ steps.check_results.outputs.matches_found }}" == "true" ]; then
            echo "  ✅ Statut: SUCCÈS"
            echo "  📊 Matchs: ${{ steps.check_results.outputs.matches_count || 'N/A' }}"
            echo "  📁 Fichier: ${{ steps.check_results.outputs.file_size || 'N/A' }}"
          else
            echo "  ❌ Statut: ÉCHEC (aucun match trouvé)"
          fi
          echo ""
          echo "📥 Télécharger les artefacts depuis l'onglet 'Summary'"
          echo "========================================"