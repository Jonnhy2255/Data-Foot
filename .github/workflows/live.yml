name: Live Matches Scraper

on:
  # UNIQUEMENT déclenchement manuel
  workflow_dispatch:

jobs:
  scrape-live-matches:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout du code
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        
      # 2. Configuration de Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      # 3. Installation des dépendances
      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install playwright
          pip install -r requirements.txt || echo "No requirements.txt found"
          
      # 4. Installation des navigateurs Playwright
      - name: 🌐 Installation des navigateurs Playwright
        run: |
          playwright install chromium
          playwright install-deps
          
      # 5. Exécution du script
      - name: 🚀 Exécution du scraper
        id: scraper
        run: |
          python live.py
        continue-on-error: true
        
      # 6. Vérification des résultats
      - name: 📊 Vérification des résultats
        id: check_results
        run: |
          if [ -f "matches_live.json" ]; then
            echo "✅ Fichier matches_live.json trouvé"
            echo "matches_found=true" >> $GITHUB_OUTPUT
            echo "file_size=$(du -h matches_live.json | cut -f1)" >> $GITHUB_OUTPUT
            matches_count=$(python -c "import json; data=json.load(open('matches_live.json')); print(len(data['matches']))" 2>/dev/null || echo "0")
            echo "matches_count=$matches_count" >> $GITHUB_OUTPUT
          else
            echo "❌ Fichier matches_live.json non trouvé"
            echo "matches_found=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        
      # 7. Sauvegarde des résultats en artefact
      - name: 💾 Sauvegarde des artefacts
        uses: actions/upload-artifact@v4
        with:
          name: live-matches-${{ github.run_id }}
          path: |
            matches_live.json
            matches_live_*.json
          retention-days: 7
          compression-level: 6
          
      # 8. Sauvegarde des logs
      - name: 📝 Sauvegarde des logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            *.log
            *.txt
            !matches_live.json
          retention-days: 3
          if-no-files-found: ignore
          
      # 9. Résumé final
      - name: ✅ Résumé final
        if: always()
        run: |
          echo "========================================"
          echo "🏁 SCRAPING TERMINÉ"
          echo "========================================"
          if [ "${{ steps.check_results.outputs.matches_found }}" == "true" ]; then
            echo "✅ Statut: SUCCÈS"
            echo "📊 Matchs: ${{ steps.check_results.outputs.matches_count || 'N/A' }}"
            echo "📁 Fichier: ${{ steps.check_results.outputs.file_size || 'N/A' }}"
          else
            echo "❌ Statut: ÉCHEC - Aucun match trouvé"
          fi
          echo ""
          echo "📥 Télécharger les artefacts depuis l'onglet 'Summary'"
          echo "========================================"